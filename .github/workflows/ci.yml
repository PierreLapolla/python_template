name: CI
on:
  push:
    branches:
      - master
      - main
  pull_request:
permissions:
  contents: read
# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  version:
    # Dependabot pull requests update dependencies only, without a version bump.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
      # Backstop for the pre-push hook (skipped by `git push --no-verify`).
      - name: Require a version bump
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uvx --with packaging python scripts/check_version_bump.py "$BASE"
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uvx pre-commit run --all-files --show-diff-on-failure
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --locked pytest
