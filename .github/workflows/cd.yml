# Pull requests touching the image: build and smoke-test it (nothing is pushed).
# Tag vX.Y.Z pushed: build multi-arch image, push to GHCR, create GitHub release.
name: CD
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - src/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/cd.yml
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: read
# Cancel superseded pull request builds; never cancel a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push to ghcr.io
    env:
      RELEASE: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches pyproject version
        if: env.RELEASE == 'true'
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - uses: docker/setup-qemu-action@v4
        if: env.RELEASE == 'true'
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.RELEASE == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.RELEASE == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.RELEASE == 'true' }}
          load: ${{ env.RELEASE != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: env.RELEASE != 'true'
        run: docker run --rm "${{ steps.meta.outputs.tags }}"

      - name: Create GitHub release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
