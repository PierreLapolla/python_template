name: CI
on:
  push:
    branches:
      - master
      - main
  pull_request:
permissions:
  contents: read
# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  version:
    # Pull requests only: merging one (e.g. from Dependabot, which never bumps)
    # would otherwise fail on master. Direct pushes are checked by the pre-push hook.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0 # no floating major tags since v8
      - name: Require a version bump
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: uvx --with packaging python scripts/check_version_bump.py "$BASE"
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0 # no floating major tags since v8
      - run: uvx pre-commit run --all-files --show-diff-on-failure
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0 # no floating major tags since v8
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --locked pytest
