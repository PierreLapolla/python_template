# Zensical configuration
# Reference: https://zensical.org/docs/setup/basics/

[project]
site_url = "https://pierrelapolla.github.io/python_template/"
site_name = "Python App Template"
site_description = "Documentation for a modern, ready-to-use Python application template."
site_author = "Pierre LAPOLLA"
copyright = "Copyright &copy; 2026 Pierre LAPOLLA"

repo_url = "https://github.com/PierreLapolla/python_template"
repo_name = "PierreLapolla/python_template"
edit_uri = "edit/master/docs/"

nav = [
  { "Overview" = "index.md" },
  { "Development" = "development.md" },
]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/PierreLapolla/python_template"

# ----------------------------------------------------------------------------
# Plugins
# ----------------------------------------------------------------------------

# "Last updated" date on each page, from git history (needs full clone in CI).
[project.plugins.git-revision-date-localized]
type = "date"
enable_creation_date = true
fallback_to_build_date = true

# Generate /llms.txt and /llms-full.txt for LLM consumption.
[project.plugins.llmstxt]

# Self-host external assets (Google Fonts, etc.) for GDPR compliance.
[project.plugins.privacy]

# ----------------------------------------------------------------------------
# Markdown extensions
# Reference: https://zensical.org/docs/setup/extensions/
# ----------------------------------------------------------------------------
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
